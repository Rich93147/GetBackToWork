<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI is done</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="setting-row">
      <label for="enabled">On</label>
      <input id="enabled" type="checkbox" role="switch" checked aria-label="Extension on or off">
    </div>
    <div class="setting-row volume-label">
      <label for="volume">Volume</label>
      <output id="volume-number" for="volume">65%</output>
    </div>
    <input id="volume" type="range" min="0" max="100" step="1" value="65" aria-label="Alert volume">
    <p id="error" role="alert" hidden></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
